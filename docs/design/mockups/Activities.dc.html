<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pulse Activities</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 900px; box-sizing: border-box; background: #0E1311; color: #EAF1EC; font-family: 'DM Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">

<div style="flex: 1; padding: 28px 20px 0 20px; display: flex; flex-direction: column; gap: 12px; min-height: 0">

<!-- Header -->
<div>
<div style="font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700">Activities</div>
<div style="font-size: 13px; color: #8FA096; margin-top: 2px">Recorded on your watch and synced automatically</div>
</div>

<!-- Weekly summary -->
<div style="background: #161D1A; border: 1px solid #2A3530; border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 12px; color: #8FA096">Last 7 days</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<div><div style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700">6</div><div style="font-size: 12px; color: #8FA096">workouts</div></div>
<div><div style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700">4h 53m</div><div style="font-size: 12px; color: #8FA096">active time</div></div>
<div><div style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700">2,284</div><div style="font-size: 12px; color: #8FA096">kcal burned</div></div>
</div>
</div>

<!-- Filters -->
<div style="display: flex; gap: 8px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
<button type="button" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
</sc-for>
</div>

<!-- Featured activity -->
<div style="background: #161D1A; border: 1px solid #2A3530; border-radius: 22px; padding: 16px 16px 14px 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px">
<div>
<div style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700">{{feat.name}}</div>
<div style="font-size: 12px; color: #8FA096; margin-top: 2px">{{feat.when}} · {{feat.sub}}</div>
</div>
<div style="{{feat.badgeStyle}}">{{feat.type}}</div>
</div>
<div style="display: flex; gap: 12px; align-items: stretch">
<div style="flex: none; width: 138px; height: 100px; border-radius: 14px; background: #1E2723; position: relative">
<svg viewBox="0 0 150 96" width="138" height="100" role="img" aria-label="{{feat.traceLabel}}" style="display: block">
<path d="{{feat.route}}" fill="none" stroke="{{feat.color}}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<div style="position: absolute; left: 8px; bottom: 6px; font-size: 10px; color: #8FA096">{{feat.traceLabel}}</div>
</div>
<div style="flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 10px; align-content: center">
<sc-for list="{{feat.stats}}" as="s" hint-placeholder-count="4">
<div>
<div style="font-size: 11px; color: #8FA096">{{s.label}}</div>
<div style="font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 700; margin-top: 1px">{{s.value}}</div>
</div>
</sc-for>
</div>
</div>
<div>
<div style="font-size: 11px; color: #8FA096; margin-bottom: 6px">Time in heart-rate zones</div>
<div style="display: flex; height: 10px; border-radius: 999px; overflow: hidden; gap: 2px">
<sc-for list="{{feat.zones}}" as="z" hint-placeholder-count="5">
<div style="{{z.segStyle}}"></div>
</sc-for>
</div>
<div style="display: flex; justify-content: space-between; margin-top: 6px">
<sc-for list="{{feat.zones}}" as="z" hint-placeholder-count="5">
<div style="font-size: 11px; color: #8FA096; display: flex; align-items: center; gap: 4px"><span style="{{z.dotStyle}}"></span>{{z.label}} {{z.pct}}%</div>
</sc-for>
</div>
</div>
</div>

<!-- List -->
<div style="flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-bottom: 12px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
<button type="button" onClick="{{r.pick}}" style="{{r.style}}">
<span style="{{r.iconStyle}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{r.color}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
</span>
<span style="flex: 1; min-width: 0; display: block">
<span style="display: block; font-size: 15px; font-weight: 700">{{r.name}}</span>
<span style="display: block; font-size: 12px; color: #8FA096; margin-top: 2px">{{r.when}} · {{r.meta}}</span>
</span>
<span style="display: block; text-align: right">
<span style="display: block; font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 700; color: #FF7A66">{{r.hr}}</span>
<span style="display: block; font-size: 11px; color: #8FA096">avg bpm</span>
</span>
</button>
</sc-for>
</div>

</div>

<!-- Tab bar -->
<div style="height: 84px; flex: none; box-sizing: border-box; border-top: 1px solid #2A3530; background: #0E1311; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 8px 8px 20px 8px">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: #8FA096">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Today</a>
<a href="Trends.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: #8FA096">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 17 9 11 13 15 21 7"></polyline><polyline points="15 7 21 7 21 13"></polyline></svg>Trends</a>
<a href="Activities.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 700; color: #C7F26B">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>Activities</a>
<a href="Coach.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: #8FA096">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path><path d="M19 17v4M17 19h4"></path></svg>Coach</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const filter = (this.state && this.state.filter) || 'All';
const sel = (this.state && this.state.sel) || null;
const COLORS = { Run: '#FF7A66', Ride: '#5ED6C1', Strength: '#8FA8FF', Walk: '#C7F26B' };
const ZC = ['#5ED6C1', '#C7F26B', '#FFD166', '#FF9F5E', '#FF6B57'];
const ROUTES = {
Walk: 'M12 78 C30 60 40 80 60 58 S95 30 110 44 S132 20 138 14',
Run: 'M16 66 C20 30 52 20 78 30 S128 46 120 72 S62 86 40 68 S28 54 40 48',
Ride: 'M12 70 C30 40 56 56 76 36 S112 14 126 34 S132 74 100 80 S40 88 12 70',
Strength: 'M8 60 L24 48 L36 62 L52 36 L66 58 L84 32 L98 56 L116 38 L142 52'
};
const ACTS = [
{ id: 'walk-sat', name: 'Morning Walk', type: 'Walk', when: 'Today · 08:05', sub: 'Avg pace 11:14 /km', meta: '3.4 km · 38:12', hr: '104', stats: [['Distance', '3.4 km'], ['Duration', '38:12'], ['Avg HR', '104 bpm'], ['Calories', '164 kcal']], zones: [34, 56, 10, 0, 0] },
{ id: 'run-fri', name: 'Tempo Run', type: 'Run', when: 'Fri 16 Oct · 18:30', sub: 'Avg pace 5:32 /km', meta: '6.2 km · 34:18', hr: '156', stats: [['Distance', '6.2 km'], ['Duration', '34:18'], ['Avg HR', '156 bpm'], ['Calories', '412 kcal']], zones: [0, 18, 41, 33, 8] },
{ id: 'str-thu', name: 'Upper Body Strength', type: 'Strength', when: 'Thu 15 Oct · 12:40', sub: '6 exercises', meta: '18 sets · 48:00', hr: '118', stats: [['Sets', '18'], ['Duration', '48:00'], ['Avg HR', '118 bpm'], ['Calories', '286 kcal']], zones: [30, 42, 22, 6, 0] },
{ id: 'ride-wed', name: 'Interval Ride', type: 'Ride', when: 'Wed 14 Oct · 07:15', sub: 'Avg speed 23.0 km/h', meta: '22.5 km · 58:40', hr: '143', stats: [['Distance', '22.5 km'], ['Duration', '58:40'], ['Avg HR', '143 bpm'], ['Calories', '521 kcal']], zones: [5, 22, 38, 28, 7] },
{ id: 'walk-tue', name: 'Evening Walk', type: 'Walk', when: 'Tue 13 Oct · 19:00', sub: 'Avg pace 12:41 /km', meta: '4.1 km · 52:00', hr: '102', stats: [['Distance', '4.1 km'], ['Duration', '52:00'], ['Avg HR', '102 bpm'], ['Calories', '198 kcal']], zones: [40, 52, 8, 0, 0] },
{ id: 'run-sun', name: 'Long Run', type: 'Run', when: 'Sun 11 Oct · 09:00', sub: 'Avg pace 5:59 /km', meta: '10.4 km · 1:02:15', hr: '149', stats: [['Distance', '10.4 km'], ['Duration', '1:02:15'], ['Avg HR', '149 bpm'], ['Calories', '703 kcal']], zones: [0, 35, 48, 15, 2] }
];
const list = ACTS.filter((a) => filter === 'All' || a.type === filter);
const chosen = list.find((a) => a.id === sel) || list[0];
const chips = ['All', 'Run', 'Ride', 'Strength', 'Walk'].map((f) => ({
label: f,
style: 'border: 1px solid ' + (f === filter ? '#C7F26B' : '#2A3530') + '; background: ' + (f === filter ? '#C7F26B' : '#161D1A') + '; color: ' + (f === filter ? '#0E1311' : '#EAF1EC') + '; font-size: 13px; font-weight: 700; border-radius: 999px; padding: 0 14px; height: 40px; cursor: pointer;',
pick: () => this.setState({ filter: f, sel: null })
}));
const rows = list.map((a) => ({
name: a.name,
when: a.when,
meta: a.meta,
hr: a.hr,
color: COLORS[a.type],
iconStyle: 'flex: none; width: 40px; height: 40px; border-radius: 12px; background: #1E2723; display: flex; align-items: center; justify-content: center;',
style: 'display: flex; align-items: center; gap: 12px; width: 100%; box-sizing: border-box; text-align: left; color: #EAF1EC; cursor: pointer; background: #161D1A; border: 1px solid ' + (a.id === chosen.id ? '#C7F26B' : '#2A3530') + '; border-radius: 16px; padding: 10px 14px; min-height: 64px;',
pick: () => this.setState({ sel: a.id })
}));
const feat = {
name: chosen.name,
when: chosen.when,
sub: chosen.sub,
type: chosen.type,
color: COLORS[chosen.type],
route: ROUTES[chosen.type],
traceLabel: chosen.type === 'Strength' ? 'Heart rate trace' : 'Route',
badgeStyle: 'flex: none; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 5px 10px; background: #1E2723; color: ' + COLORS[chosen.type] + ';',
stats: chosen.stats.map((s) => ({ label: s[0], value: s[1] })),
zones: chosen.zones.map((v, i) => ({
label: 'Z' + (i + 1),
pct: v,
segStyle: 'flex: ' + v + ' 1 0; background: ' + ZC[i] + ';',
dotStyle: 'display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: ' + ZC[i] + ';'
}))
};
return { chips: chips, rows: rows, feat: feat };
}
}
</script>
</body>
</html>
