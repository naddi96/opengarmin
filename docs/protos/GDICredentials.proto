syntax = "proto2";

package GDI.Proto.Credentials;

import "GDICore.proto";

enum CredentialType {
  ALPHA_IT_OAUTH_2 = 0;
  GENERIC_IT_OAUTH_2 = 1;
  AMAZON_MUSIC = 2;
}

enum GCSLocation {
  PRODUCTION = 0;
  CHINA = 1;
  TEST = 2;
  STAGE = 3;
}

message OAuthCredentials {
  string consumer_key = 1;
  string consumer_secret = 2;
  string oauth_token = 3;
  string oauth_secret = 4;
}

message DIOAuth2Credentials {
  string access_token = 1;
  string token_type = 2;
  string refresh_token = 3;
  uint32 expires_in = 4;
  string scope = 5;
  string jti = 6;
  uint32 refresh_token_expires_in = 7;
  string mfa_token = 8;
  string mfa_expiration_timestamp = 9;
  uint64 mfa_expiration_timestamp_ms = 10;
}

message SIPCredentials {
  string username = 1;
  string server = 2;
  string password = 3;
}

message OAuth2Credentials {
  string access_token = 1;
  string token_type = 2;
  string refresh_token = 3;
  uint32 expires_in = 4;
  repeated string scope = 5;
  string jti = 6;
  uint32 refresh_token_expires_in = 7;
  string mfa_token = 8;
  uint64 mfa_expiration_timestamp_ms = 9;
}

message CredentialsService {
  GDI.Proto.Credentials.GCOAuthCredentialsRequest gc_oauth_request = 1;
  GDI.Proto.Credentials.GCOAuthCredentialsResponse gc_oauth_response = 2;
  GDI.Proto.Credentials.DIOAuth2CredentialsRequest di_oauth_2_request = 3;
  GDI.Proto.Credentials.DIOAuth2CredentialsResponse di_oauth_2_response = 4;
  GDI.Proto.Credentials.OAuth2CredentialsRequest oauth2_request = 5;
  GDI.Proto.Credentials.OAuth2CredentialsResponse oauth2_response = 6;
  GDI.Proto.Credentials.SIPCredentialsRequest sip_credentials_request = 7;
  GDI.Proto.Credentials.SIPCredentialsResponse sip_credentials_response = 8;
}

message GCOAuthCredentialsRequest {
}

message DIOAuth2CredentialsRequest {
}

message SIPCredentialsRequest {
}

message OAuth2CredentialsRequest {
  GDI.Proto.Credentials.CredentialType credential_type = 1;
  string client_id = 2;
}

message GCOAuthCredentialsResponse {
  GDI.Proto.Credentials.OAuthCredentials oauth_credentials = 1;
  GDI.Proto.Credentials.GCSLocation gcs_location = 2;
}

message DIOAuth2CredentialsResponse {
  GDI.Proto.Credentials.DIOAuth2Credentials credentials = 1;
  GDI.Proto.Credentials.GCSLocation gcs_location = 2;
}

message SIPCredentialsResponse {
  GDI.Proto.Credentials.SIPCredentials credentials = 1;
}

message OAuth2CredentialsResponse {
  GDI.Proto.Credentials.CredentialType credential_type = 1;
  GDI.Proto.Credentials.OAuth2Credentials credentials = 2;
  GDI.Proto.Credentials.GCSLocation environment = 3;
}

message CapabilitiesRequest {
  repeated GDI.Proto.Credentials.CredentialType supported_credential_types = 1;
  bool support_sip_credentials = 2;
}

message CapabilitiesResponse {
}
