syntax = "proto2";

package GDI.Proto.Calendar;

message CalendarService {
  GDI.Proto.Calendar.CalendarEventsRequest calendar_events_request = 1;
  GDI.Proto.Calendar.CalendarEventsResponse calendar_events_response = 2;
}

message CalendarEventsRequest {
  uint64 start_date = 1;
  uint64 end_date = 2;
  bool include_organizer = 3;
  bool include_title = 4;
  bool include_location = 5;
  bool include_description = 6;
  bool include_start_date = 7;
  bool include_end_date = 8;
  bool include_all_day = 9;
  uint32 max_organizer_length = 10;
  uint32 max_title_length = 11;
  uint32 max_location_length = 12;
  uint32 max_description_length = 13;
  uint32 max_events = 14;
}

message CalendarEventsResponse {
  enum ResponseStatus {
    UNKNOWN_RESPONSE_STATUS = 0;
    OK = 1;
    INVALID_DATE_RANGE = 2;
  }
  GDI.Proto.Calendar.CalendarEventsResponse.ResponseStatus status = 1;
  repeated GDI.Proto.Calendar.CalendarEvent events = 2;
}

message CalendarEvent {
  string organizer = 1;
  string title = 2;
  string location = 3;
  string description = 4;
  uint64 start_date = 5;
  uint64 end_date = 6;
  bool all_day = 7;
  repeated uint32 reminder_time_in_secs = 8;
}
