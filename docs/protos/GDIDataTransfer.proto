syntax = "proto2";

package GDI.Proto.DataTransfer;

import "GDICore.proto";
import "GDIDataTypes.proto";

message DataTransferService {
  GDI.Proto.DataTransfer.DataDownloadRequest data_download_request = 1;
  GDI.Proto.DataTransfer.DataDownloadResponse data_download_response = 2;
  GDI.Proto.DataTransfer.InitiateDataUploadRequest initiate_data_upload_request = 3;
  GDI.Proto.DataTransfer.InitiateDataUploadResponse initiate_data_upload_response = 4;
  GDI.Proto.DataTransfer.DataUploadRequest data_upload_request = 5;
  GDI.Proto.DataTransfer.DataUploadResponse data_upload_response = 6;
  GDI.Proto.DataTransfer.DataUploadCanceledNotification data_upload_canceled_notification = 7;
  GDI.Proto.DataTransfer.FileAccessItemRequest file_access_item_request = 8;
  GDI.Proto.DataTransfer.FileAccessItemResponse file_access_item_response = 9;
}

message CapabilitiesRequest {
  uint32 service_version = 1;
}

message CapabilitiesResponse {
}

message DataDownloadRequest {
  uint32 id = 1;
  uint32 offset = 2;
  uint32 max_chunk_size = 3;
}

message DataDownloadResponse {
  enum Status {
    UNKNOWN = 0;
    SUCCESS = 1;
    INVALID_ID = 2;
    INVALID_OFFSET = 3;
  }
  GDI.Proto.DataTransfer.DataDownloadResponse.Status status = 1;
  uint32 id = 2;
  uint32 offset = 3;
  bytes payload = 4;
}

message InitiateDataUploadRequest {
  uint32 id = 1;
}

message InitiateDataUploadResponse {
  enum Status {
    UNKNOWN = 0;
    OK = 1;
    INVALID_ID = 2;
  }
  uint32 id = 1;
  GDI.Proto.DataTransfer.InitiateDataUploadResponse.Status status = 2;
}

message DataUploadRequest {
  uint32 id = 1;
  uint32 offset = 2;
  bytes payload = 3;
}

message DataUploadResponse {
  enum Status {
    UNKNOWN = 0;
    SUCCESS = 1;
    INVALID_ID = 2;
    INVALID_OFFSET = 3;
    SIZE_MISMATCH = 4;
    ABORT = 5;
  }
  uint32 id = 1;
  GDI.Proto.DataTransfer.DataUploadResponse.Status status = 2;
}

message DataUploadCanceledNotification {
  uint32 id = 1;
}

message FileAccessItemRequest {
  enum Latency {
    STANDARD = 0;
    SOON = 1;
    IMMEDIATE = 2;
    DURING_ACTIVITY = 3;
  }
  uint32 data_xfer_id = 1;
  GDI.Proto.DataTransfer.FileAccessItemRequest.Latency expected_latency = 2;
}

message FileAccessItemResponse {
  enum Status {
    UNKNOWN = 0;
    OK = 1;
    INVALID_ID = 2;
  }
  GDI.Proto.DataTransfer.FileAccessItemResponse.Status status = 1;
  uint32 data_xfer_id = 2;
  GDI.Proto.DataTypes.UUID file_access_item_uid = 3;
}
