syntax = "proto2";

package GDI.Proto.GNCS;

import "GDICore.proto";
import "GDIDataTypes.proto";

enum NotificationDisabledReason {
  LOW_RAM_MOBILE_DEVICE = 1;
  PERMISSION_NOT_GRANTED = 2;
  SERVICE_NOT_BOUND = 3;
}

enum MediaType {
  PNG = 0;
  JPEG = 1;
}

message CapabilitiesRequest {
  uint32 np_version = 1;
  GDI.Proto.GNCS.NotificationDisabledReason notification_disabled_reason = 2;
  string default_messaging_app_id = 3;
  string default_dialer_app_id = 4;
}

message CapabilitiesResponse {
  uint32 nc_version = 1;
}

message Service {
  GDI.Proto.GNCS.MediaRequest media_request = 1;
  GDI.Proto.GNCS.MediaResponse media_response = 2;
}

message DisplayAttributes {
  uint32 width_px = 1;
  uint32 height_px = 2;
  uint32 max_byte_size = 3;
  uint32 quality = 4;
}

message MediaRequest {
  uint32 notification_uid = 1;
  uint32 index = 2;
  GDI.Proto.GNCS.DisplayAttributes attributes = 3;
  repeated GDI.Proto.GNCS.MediaType supported_types = 4;
}

message MediaResponse {
  enum Status {
    UNKNOWN = 0;
    SUCCESS = 1;
    INVALID_UID = 2;
    INVALID_INDEX = 3;
  }
  GDI.Proto.GNCS.MediaResponse.Status status = 1;
  uint32 notification_uid = 2;
  uint32 index = 3;
  GDI.Proto.GNCS.MediaType type = 4;
  GDI.Proto.DataTypes.DataTransferItem transfer_info = 5;
}
