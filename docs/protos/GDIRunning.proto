syntax = "proto2";

package GDI.Proto.Running;

import "GDICore.proto";
import "GDIEventSharing.proto";

message Service {
  GDI.Proto.Running.ConfigurationRequest configuration_request = 1;
  GDI.Proto.Running.ConfigurationResponse configuration_response = 2;
  GDI.Proto.Running.ConfigurationNotification configuration_notification = 3;
  GDI.Proto.Running.ResetSpeedDistanceCalibrationMetricsRequest reset_calibration_request = 4;
  GDI.Proto.Running.ResetSpeedDistanceCalibrationMetricsResponse reset_calibration_response = 5;
}

message CapabilitiesRequest {
}

message SpeedDistanceCapabilities {
  bool is_auto_calibration_supported = 1;
}

message DynamicsCapabilities {
  bool is_step_speed_loss_supported = 1;
}

message CapabilitiesResponse {
  GDI.Proto.Running.SpeedDistanceCapabilities speed_distance_capabilities = 1;
  GDI.Proto.Running.DynamicsCapabilities dynamics_capabilities = 2;
}

message SpeedDistanceConfigurationFields {
  uint32 treadmill_calibration_factor_1_100_pct = 1;
  bool is_auto_calibration_enabled = 2;
  uint32 user_height_cm = 3;
}

message ConfigurationRequest {
  GDI.Proto.Running.SpeedDistanceConfigurationFields speed_distance_config = 1;
}

message ConfigurationResponse {
  GDI.Proto.Running.SpeedDistanceConfigurationFields speed_distance_config = 1;
}

message ConfigurationNotification {
  GDI.Proto.Running.SpeedDistanceConfigurationFields speed_distance_config = 1;
}

message ResetSpeedDistanceCalibrationMetricsRequest {
}

message ResetSpeedDistanceCalibrationMetricsResponse {
}

message Dynamics {
  uint32 vertical_oscillation_1_4ths_mm = 1;
  uint32 ground_contact_time_ms = 2;
  uint32 stance_time_1_4ths_percent = 3;
  uint32 ground_contact_balance_1_32ths_percent = 4;
  uint32 vertical_ratio_1_32ths_percent = 5;
  uint32 step_length_mm = 6;
  bool is_module_right_side_up = 7;
  uint32 cadence_1_32_strides_per_min = 8;
  uint32 step_count = 9;
  bool is_walking = 10;
  GDI.Proto.Running.StepSpeedLoss step_speed_loss_data = 11;
}

message StepSpeedLoss {
  sint32 step_forward_velocity_trough_mm_per_s = 1;
  sint32 step_forward_velocity_peak_mm_per_s = 2;
  sint32 step_forward_velocity_mean_mm_per_s = 3;
  sint32 step_vertical_velocity_at_trough_mm_per_s = 4;
  uint32 time_to_trough_ms = 5;
}

message SpeedDistance {
  uint32 speed_1_256_m_per_s = 1;
  uint32 distance_1_16_m = 2;
}

message MeasurementNotification {
  GDI.Proto.Running.Dynamics dynamics_data = 1;
  GDI.Proto.Running.SpeedDistance speed_distance_data = 2;
}

message SpeedDistanceAlgorithmInputs {
  sint32 grade_1_100_pct = 1;
  uint32 gps_speed_1_mm_per_s = 2;
}

message AlgorithmInputNotification {
  uint32 horizontal_speed_1_256ths_ms = 1;
  GDI.Proto.Running.SpeedDistanceAlgorithmInputs speed_distance_algorithm_inputs = 2;
}
